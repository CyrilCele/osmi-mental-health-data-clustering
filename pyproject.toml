[project]
name = "osmi-mental-health-data-clustering"
version = "0.1.0"
description = "Reproducible CRISP-DM workflow for interpretable clustering of the OSMI 2016 Mental Health in Tech survey"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "hdbscan>=0.8.44",
    "kmodes>=0.12.2",
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "pandas>=3.1.0",
    "scipy>=1.16.3",
    "scikit-learn>=1.9.1",
    "seaborn>=0.13.2",
]

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "jupyter>=1.1.1",
    "ruff>=0.17.3",
]
